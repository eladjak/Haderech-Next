name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Unit & Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint without warnings
        run: npm run lint -- --max-warnings=0

      - name: Unit and contract tests
        run: npm test

      - name: Dependency audit
        run: npm audit --audit-level=high

  build:
    name: Typecheck & Build
    runs-on: ubuntu-latest

    # Dummy *public* build-time values only. The real app uses Convex + Clerk,
    # but `next build` (build:local) only needs the NEXT_PUBLIC_* keys present to
    # render the providers — it never contacts Convex/Clerk at build time. No
    # production secrets are required (or used) for this CI to genuinely verify
    # typecheck + build. The full `npm run build` (`convex deploy`) is intentionally
    # NOT run here because it needs a real CONVEX_DEPLOY_KEY (prod deploy = Vercel's job).
    env:
      # Syntactically valid throwaway Clerk test key (base64 host "dummy-clerk-key-for-ci-build.clerk.accounts.dev$").
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZHVtbXktY2xlcmsta2V5LWZvci1jaS1idWlsZC5jbGVyay5hY2NvdW50cy5kZXYk
      CLERK_SECRET_KEY: sk_test_dummyclerksecretkeyforcibuild
      NEXT_PUBLIC_CONVEX_URL: https://dummy-ci-build.convex.cloud
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
      NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: /dashboard
      NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: /dashboard
      # NOTE: do NOT set NODE_ENV=production at the job level -- `npm ci` would then
      # skip devDependencies (vitest, @types/*, eslint), and tsconfig includes the
      # test files, so typecheck would fail on missing 'vitest'. next build sets its
      # own production mode regardless.

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build:local

  e2e:
    name: Browser E2E & Accessibility
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
      NEXT_PUBLIC_CONVEX_URL: ${{ secrets.E2E_CONVEX_URL }}
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
      NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: /dashboard
      NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: /dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate staging provider configuration
        shell: bash
        run: |
          missing=0
          for name in NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY CLERK_SECRET_KEY NEXT_PUBLIC_CONVEX_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured for browser E2E"
              missing=1
            fi
          done
          exit "$missing"

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e

      - name: Upload browser report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
